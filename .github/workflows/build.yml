name: Build clients

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - mode: -DebugBuild
            artifact: client-debug-swf
          - mode: -MinimalBuild
            artifact: client-release-swf
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Build ${{ matrix.artifact }}
        run: |
          chmod +x build.sh
          ./build.sh ${{ matrix.mode }}

      - name: Upload ${{ matrix.artifact }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: client.swf
          if-no-files-found: error
          compression-level: 0
