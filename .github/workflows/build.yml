name: Build clients

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - mode: -DebugBuild
            output: client-debug.swf
          - mode: -MinimalBuild
            output: client.swf
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 8
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '8'

      - name: Write SWF commit
        run: printf '%s\n' "$GITHUB_SHA" > assets/version.txt

      - name: Build ${{ matrix.output }}
        run: |
          chmod +x build.sh
          ./build.sh ${{ matrix.mode }}
          if [ "${{ matrix.output }}" != "client.swf" ]; then
            mv client.swf "${{ matrix.output }}"
          fi

      - name: Upload ${{ matrix.output }}
        uses: actions/upload-artifact@v7
        with:
          path: ${{ matrix.output }}
          if-no-files-found: error
          archive: false

      - name: Publish latest client release
        if: matrix.output == 'client.swf' && github.ref_name == github.event.repository.default_branch && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Build $(date -u +'%Y-%m-%d %H:%M UTC')"
          if gh release view latest >/dev/null 2>&1; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/latest" -f sha="$GITHUB_SHA" -F force=true >/dev/null
            gh release edit latest --title "$title" --notes "Built from commit $GITHUB_SHA" --latest
          else
            gh release create latest --target "$GITHUB_SHA" --title "$title" --notes "Built from commit $GITHUB_SHA" --latest
          fi
          gh release upload latest client.swf --clobber
