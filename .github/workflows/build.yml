name: Build clients

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - mode: -DebugBuild
            output: client-debug.swf
          - mode: -MinimalBuild
            output: client.swf
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 8
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '8'

      - name: Build ${{ matrix.output }}
        run: |
          chmod +x build.sh
          ./build.sh ${{ matrix.mode }}
          if [ "${{ matrix.output }}" != "client.swf" ]; then
            mv client.swf "${{ matrix.output }}"
          fi

      - name: Upload ${{ matrix.output }}
        uses: actions/upload-artifact@v7
        with:
          path: ${{ matrix.output }}
          if-no-files-found: error
          archive: false
